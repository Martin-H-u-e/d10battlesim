<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SVG Slideshow</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #181818;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    /* Start screen */
    #start {
        position: fixed;
        inset: 0;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        gap: 20px;
    }

    #start h1 {
        margin: 0;
        font-size: 28px;
    }

    #selectFolder {
        background: #333;
        color: white;

        border: 1px solid #555;
        border-radius: 6px;

        padding: 12px 22px;
        font-size: 18px;

        cursor: pointer;
    }

    #selectFolder:hover {
        background: #444;
    }

    #hint {
        color: #999;
        font-size: 14px;
    }

    /* SVG viewer */
    #viewer {
        width: 100%;
        height: 100%;

        display: none;

        align-items: center;
        justify-content: center;
    }

    #slide {
        max-width: 95vw;
        max-height: 90vh;

        object-fit: contain;
        user-select: none;
    }

    /* Filename */
    #filename {
        position: fixed;

        top: 15px;
        left: 0;
        right: 0;

        text-align: center;

        color: #999;
        font-size: 14px;
    }

    /* Bottom controls */
    #controls {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 20px;

        display: none;

        justify-content: center;
        align-items: center;

        gap: 20px;
    }

    #controls button {
        background: #333;
        color: white;

        border: 1px solid #555;
        border-radius: 6px;

        padding: 10px 18px;

        font-size: 18px;
        cursor: pointer;
    }

    #controls button:hover {
        background: #444;
    }

    #counter {
        min-width: 80px;
        text-align: center;
        font-size: 16px;
    }

    /* Hidden folder picker */
    #folderInput {
        display: none;
    }
</style>

</head>

<body>

<!-- Start screen -->

<div id="start">

```
<h1>SVG Slideshow</h1>

<button id="selectFolder">
    Select SVG Folder
</button>

<input
    id="folderInput"
    type="file"
    webkitdirectory
    multiple
    accept=".svg,image/svg+xml"
>

<div id="hint">
    Select a folder containing your SVG files
</div>
```

</div>

<!-- Viewer -->

<div id="viewer">
    <img id="slide" alt="SVG slide">
</div>

<!-- Filename -->

<div id="filename"></div>

<!-- Navigation -->

<div id="controls">

```
<button id="previous">←</button>

<div id="counter">
    0 / 0
</div>

<button id="next">→</button>
```

</div>

<script>

    const folderInput =
        document.getElementById("folderInput");

    const selectFolder =
        document.getElementById("selectFolder");

    const start =
        document.getElementById("start");

    const viewer =
        document.getElementById("viewer");

    const controls =
        document.getElementById("controls");

    const slide =
        document.getElementById("slide");

    const counter =
        document.getElementById("counter");

    const filename =
        document.getElementById("filename");

    const previous =
        document.getElementById("previous");

    const next =
        document.getElementById("next");


    let slides = [];
    let current = 0;
    let currentURL = null;


    /*
        Open the folder picker.
    */
    selectFolder.addEventListener("click", () => {

        folderInput.click();

    });


    /*
        Folder selected.
    */
    folderInput.addEventListener("change", () => {

        const files = Array.from(folderInput.files);

        slides = files
            .filter(file =>
                file.name
                    .toLowerCase()
                    .endsWith(".svg")
            )
            .sort((a, b) =>
                a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
            );


        if (slides.length === 0) {

            alert(
                "No SVG files were found in the selected folder."
            );

            return;
        }


        current = 0;

        start.style.display = "none";
        viewer.style.display = "flex";
        controls.style.display = "flex";

        showSlide();

    });


    /*
        Display current SVG.
    */
    function showSlide() {

        if (slides.length === 0) {
            return;
        }


        const file = slides[current];


        /*
            Delete the previous temporary URL.
        */
        if (currentURL !== null) {

            URL.revokeObjectURL(currentURL);

        }


        /*
            Create a temporary browser URL
            for the SVG file.
        */
        currentURL =
            URL.createObjectURL(file);


        slide.src = currentURL;


        counter.textContent =
            `${current + 1} / ${slides.length}`;


        filename.textContent =
            file.name;

    }


    /*
        Next slide.
    */
    function nextSlide() {

        if (slides.length === 0) {
            return;
        }


        current++;


        if (current >= slides.length) {
            current = 0;
        }


        showSlide();

    }


    /*
        Previous slide.
    */
    function previousSlide() {

        if (slides.length === 0) {
            return;
        }


        current--;


        if (current < 0) {
            current = slides.length - 1;
        }


        showSlide();

    }


    /*
        Mouse buttons.
    */
    next.addEventListener(
        "click",
        nextSlide
    );


    previous.addEventListener(
        "click",
        previousSlide
    );


    /*
        Keyboard navigation.
    */
    document.addEventListener("keydown", event => {

        if (slides.length === 0) {
            return;
        }


        switch (event.key) {

            case "ArrowRight":
            case "ArrowDown":
            case " ":

                event.preventDefault();
                nextSlide();

                break;


            case "ArrowLeft":
            case "ArrowUp":

                event.preventDefault();
                previousSlide();

                break;


            case "Home":

                event.preventDefault();

                current = 0;
                showSlide();

                break;


            case "End":

                event.preventDefault();

                current = slides.length - 1;
                showSlide();

                break;


            case "Escape":

                start.style.display = "flex";
                viewer.style.display = "none";
                controls.style.display = "none";

                filename.textContent = "";

                break;

        }

    });

</script>

</body>
</html>
